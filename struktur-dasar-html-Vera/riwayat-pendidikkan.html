<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Pendidikan</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        max-width: 600px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }
      .title {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .content {
        padding: 10px;
      }
      .row {
        margin-bottom: 15px;
        padding: 10px;
        background: #e0e0e0;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">Riwayat Pendidikan</div>
      <div class="content">
        <div class="row"><strong>SD:</strong> SDN Ciomas 08 (2015 - 2021)</div>
        <div class="row">
          <strong>SMP:</strong> MTs. Darul Ihya (2021 - 2024)
        </div>
        <div class="row">
          <strong>SMK:</strong> SMK Informatika Bina Generasi 1, Jurusan DKV
          (2024 - Sekarang)
        </div>
      </div>
    </div>
  </body>
</html>
